<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Management System</h1>

        <div class="form-section">
            <input type="text" id="studentId" placeholder="Student ID">
            <input type="text" id="studentName" placeholder="Student Name">
            <input type="text" id="course" placeholder="Course">

            <button onclick="addStudent()">Add Student</button>
        </div>

        <p class="form-info">
            Enter Student ID, Name and Course to register a new student.
        </p>

        <div class="search-section">
            <input type="text" id="searchId" placeholder="Enter Student ID">
            <button onclick="searchStudent()">Search Student</button>
            <button onclick="displayStudents()">Display All</button>
        </div>

        <div id="message"></div>

        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
